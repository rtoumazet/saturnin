name: CMake

on:
  push:
  pull_request:
    branches: [ "master" ]

env:
  # RelWithDebInfo is the CMake equivalent of the former DebugFast configuration.
  BUILD_PLATFORM: x64
  BUILD_CONFIGURATION: RelWithDebInfo
  
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  BUILD_DIR: build
  
  BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
  
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: master
        fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis    

    - name: Expose GitHub runtime variables
      uses: actions/github-script@v9
      with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');
            // Optional: For v2 cache service if required by your tool
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            
    - name: Restore from cache and install vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '00c5775211f45cd08b37fce0484b4cb940e422ab' #2026.08.25
        vcpkgDirectory: D:\a\saturnin\saturnin\vcpkg
        
    - name: Install vcpkg dependencies
      run: |
        $VCPKG_ROOT/vcpkg install --triplet $VCPKG_DEFAULT_TRIPLET
      shell: bash  

    - name: Configure CMake
      shell: pwsh
      run: >-
        cmake -S . -B "${{ env.BUILD_DIR }}"
        -G "Visual Studio 18 2026"
        -A ${{ env.BUILD_PLATFORM }}
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_DEFAULT_TRIPLET }}
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    
    - name: Install Build Wrapper
      uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v5
    
    - name: Run build-wrapper
      run: |
        build-wrapper-win-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build "${{ env.BUILD_DIR }}" --config ${{ env.BUILD_CONFIGURATION }} --parallel
    - name: Run sonar-scanner
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Put the name of your token here
      with:
        args: >
          --define sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
